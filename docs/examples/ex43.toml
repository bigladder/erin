# Simulation Information
[simulation_info]
input_format_version = "0.2"
rate_unit = "kW"
quantity_unit = "kJ"
time_unit = "hours"
max_time = 8

# Distributions
[dist.substation_electrical_mtbf]
type = "weibull"
time_unit = "hours"
shape = 5.0
scale = 5000.0
location = 0.0

[dist.substation_electrical_mttr]
type = "fixed"
time_unit = "hours"
value = 24.0

[dist.immediately]
type = "fixed"
time_unit = "hours"
value = 0.0

# Fragility Modes
[fragility_mode.downed_power_lines]
fragility_curve = "downed_power_lines"
repair_dist = "substation_electrical_mttr"

# Fragility Curves
[fragility_curve.downed_power_lines]
vulnerable_to = "wind_speed"
type = "linear"
lower_bound = 80.0
upper_bound = 160.0

# Loads
[loads.se_campus_load__black_sky_substation_loss__electricity]
time_unit = "h"
rate_unit = "W"
time_rate_pairs = [
 [0.0, 98413.572],
 [1.0, 97919.427],
 [2.0, 97323.615],
 [3.0, 105998.313],
 [4.0, 106490.35],
 [5.0, 126971.626],
 [6.0, 249339.583],
 [7.0, 269085.759],
 [8.0, 0.0],
]

# Components
[components.se_campus_load__electricity]
type = "load"
report = true
inflow = "electricity"
loads_by_scenario.black_sky_substation_loss = "se_campus_load__black_sky_substation_loss__electricity"


[components.transfer_switch]
type = "switch"
report = true
flow = "electricity"

[components.electric_substation]
type = "muxer"
report = true
flow = "electricity"
num_inflows = 1
num_outflows = 1
fragility_modes = ["downed_power_lines"]

[components.electric_utility]
type = "source"
report = true
max_outflow = 10000.0
rate_unit = "kW"
outflow = "electricity"

[components.genset]
type = "variable_efficiency_converter"
report = true
efficiency_by_fraction_out = [[0.0, 0.28], [1.0, 0.28]]
inflow = "diesel"
lossflow = "waste_heat"
max_outflow = 1000.0
outflow = "electricity"
rate_unit = "MW"

[components.diesel_fuel_tank]
type = "store"
report = true
capacity = 35997120.231   # kJ
capacity_unit = "kJ"
charge_at_soc = 0.5
flow = "diesel"
init_soc = 0.5
max_charge = 10000.0
max_discharge = 10000.0
max_outflow = 10000.0
roundtrip_efficiency = 1.0

# Network
[network]
connections = [
 ["electric_substation:OUT(0)", "transfer_switch:IN(0)", "electricity"],
 ["transfer_switch:OUT(0)", "se_campus_load__electricity:IN(0)", "electricity"],
 ["electric_utility:OUT(0)", "electric_substation:IN(0)", "electricity"],
 ["diesel_fuel_tank:OUT(0)", "genset:IN(0)", "diesel"],
 ["genset:OUT(0)", "transfer_switch:IN(1)", "electricity"]
]

# Scenarios
[scenarios.black_sky_substation_loss]
time_unit = "hours"
occurrence_distribution = "immediately"
duration = 8
max_occurrences = 1
time_offset = 5088.0
intensity.wind_speed = 180.0

